services:
  - type: web
    name: tarang-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://tarangwave.netlify.app
      - key: PUBLIC_API_URL
        value: https://tarang-api.onrender.com